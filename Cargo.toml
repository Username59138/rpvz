[workspace]
resolver = "3"
members = ["crates/rpvz-assets", "crates/rpvz-formats", "crates/rpvz-game", "crates/rpvz-sim"]
# `cargo run` starts the game; use --workspace to build or test everything.
default-members = ["crates/rpvz-game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Username59138/rpvz"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2
